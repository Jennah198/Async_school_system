name: Odoo Audit Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  audit-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Run Odoo audit
        run: |
          echo "Odoo Audit Pipeline started successfully"
          python scripts/audit_odoo.py


      - name: Display audit report
        run: |
          echo "Generated Audit Report:"
          cat reports/audit_report.md


      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: odoo-audit-report
          path: reports/audit_report.md